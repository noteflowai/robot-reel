[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-reel"
version = "0.14.0"
description = "Inspect real VLA rollouts and direct recorded physics into editable Blender/OpenUSD films."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "strands-robots[sim-mujoco]==0.5.1",
  "mujoco==3.13.0",
  "imageio-ffmpeg>=0.6,<0.7",
  "Pillow>=10",
  "numpy>=1.26",
]

[project.scripts]
robot-reel = "robot_reel.cli:main"

[tool.setuptools.packages.find]
include = ["robot_reel*"]

[tool.setuptools.package-data]
robot_reel = ["replay.html", "comparison.html", "newton.html", "cloth.html", "solver_lab.html", "scene_lab.html", "scene_lab.js", "scene_motion_view.js", "libero_plus.html", "libero_plus.js", "lerobot.html", "director.html", "vla.html", "chaos.html", "stress.html", "resources/stress/*.txt", "resources/cloth/*.txt"]

[project.optional-dependencies]
microduck = ["onnxruntime==1.30.0"]
newton = ["newton==1.6.0", "warp-lang==1.17.0", "usd-core==26.3"]
director = ["mcp==2.1.1"]
inspect = ["mcap==1.4.0"]
rerun = ["rerun-sdk==0.37.2"]
lerobot = ["pyarrow>=15", "huggingface_hub>=0.25"]

[project.urls]
Homepage = "https://noteflowai.github.io/robot-reel/"
Repository = "https://github.com/noteflowai/robot-reel"
Issues = "https://github.com/noteflowai/robot-reel/issues"
