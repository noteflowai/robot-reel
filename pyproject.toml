[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-reel"
version = "0.3.0"
description = "Record MuJoCo and Newton runs as inspectable replays and editable Blender/OpenUSD scenes."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "strands-robots[sim-mujoco]==0.5.1",
  "mujoco==3.13.0",
  "imageio-ffmpeg>=0.6,<0.7",
  "Pillow>=10",
  "numpy>=1.26",
]

[project.scripts]
robot-reel = "robot_reel.cli:main"

[tool.setuptools.packages.find]
include = ["robot_reel*"]

[tool.setuptools.package-data]
robot_reel = ["replay.html", "comparison.html", "newton.html"]

[project.optional-dependencies]
microduck = ["onnxruntime==1.30.0"]
newton = ["newton==1.6.0", "warp-lang==1.17.0", "usd-core==26.3"]

[project.urls]
Homepage = "https://noteflowai.github.io/robot-reel/"
Repository = "https://github.com/noteflowai/robot-reel"
Issues = "https://github.com/noteflowai/robot-reel/issues"
