name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify traces and plans without rendering dependencies
        run: python -S -m unittest discover -s tests -v
      - run: pip install -e '.[director]'
      - run: python -m unittest discover -s tests -v
      - name: Check actual MCP stdio tools and workspace boundaries
        run: python scripts/check_director_mcp.py
      - name: Check recorded VLA camera lengths against the action trace
        run: robot-reel vla docs/vla --check-media
      - run: python -m compileall -q robot_reel
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
  newton:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[newton]'
      - name: Record real CPU physics and check every USD transform
        run: |
          robot-reel newton --seconds 1 --output artifacts/newton-ci
          robot-reel newton --output artifacts/newton-ci --verify --check-usd
