# Release the distributions already installed and tested by Validate.
#
# One-time setup:
#   1. On https://pypi.org, open the robot-reel project (or "Publishing" while
#      registering a pending publisher) and add a trusted publisher:
#        owner: noteflowai   repository: robot-reel
#        workflow: release.yml   environment: pypi
#   2. In the GitHub repository settings, create an environment named "pypi"
#      (Settings -> Environments). Optionally require reviewers there.
#   3. Set repository variable PYPI_PUBLISH_ENABLED=true after that setup.
#      Without it, verified downloads are still published to GitHub Releases.
#   4. Bump [project].version and CHANGELOG.md, then push a matching v* tag.
name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require the tag, package and changelog to agree
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit("Release tag must match pyproject.toml")
          if not any(line.startswith(f"## {version} — ") for line in pathlib.Path("CHANGELOG.md").read_text().splitlines()):
              raise SystemExit("Release version needs a CHANGELOG.md entry")
          PY
  verify:
    needs: version
    uses: ./.github/workflows/validate.yml
  github:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preserve existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, urllib.error, urllib.parse, urllib.request
          tag = urllib.parse.quote(os.environ["RELEASE_TAG"], safe="")
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/releases/tags/{tag}"
          request = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
          })
          try:
              with urllib.request.urlopen(request) as response:
                  response.read()
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          else:
              raise SystemExit("This tag already has a release. Existing assets will not be overwritten.")
          PY
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: offline-lab
          path: offline-assets
      - name: Prepare notes and checksums for the tested files
        run: |
          python scripts/prepare_release.py --distributions dist --offline offline-assets \
            --output release-assets --notes release-notes.md
      - name: Upload the tested files to a draft
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: release-assets/*
          fail_on_unmatched_files: true
          draft: true
          overwrite_files: false
      - name: Publish only after every file has uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
  publish:
    needs: [verify, github]
    if: vars.PYPI_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
