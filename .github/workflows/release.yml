# Release: build the sdist/wheel on a v* tag, attach them to the GitHub release
# and publish to PyPI through trusted publishing (no API token stored in GitHub).
#
# One-time setup:
#   1. On https://pypi.org, open the robot-reel project (or "Publishing" while
#      registering a pending publisher) and add a trusted publisher:
#        owner: noteflowai   repository: robot-reel
#        workflow: release.yml   environment: pypi
#   2. In the GitHub repository settings, create an environment named "pypi"
#      (Settings -> Environments). Optionally require reviewers there.
#   3. Bump [project].version in pyproject.toml, then push a matching tag:
#        git tag v0.4.0 && git push origin v0.4.0
name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
      - name: Attach the distributions to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
